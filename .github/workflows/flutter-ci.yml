name: Flutter CI and Android QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Format, analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android project when missing
        id: android
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.vynora --project-name vynora .
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          source = source.replace('android:label="vynora"', 'android:label="Vynora"')
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\\n'
          if "android.permission.INTERNET" not in source:
              source = source.replace(
                  '<application',
                  permission + '    <application',
                  1,
              )
          manifest.write_text(source, encoding="utf-8")
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build Android release-mode QA APK
        run: >
          flutter build apk --release
          --dart-define=YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}

      - name: Upload Android QA APK
        uses: actions/upload-artifact@v4
        with:
          name: vynora-android-qa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Persist generated Android platform files
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          git add android pubspec.lock
          if [ -f .metadata ]; then git add .metadata; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(android): add generated Android platform and lockfile"
            git push origin HEAD:main
          else
            echo "No generated platform changes to persist."
          fi
