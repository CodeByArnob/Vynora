name: Vynora APK Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.1.0-preview.1)"
        required: true
        type: string
      prerelease:
        description: "Mark this as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: vynora-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.2.3 or v0.1.0-preview.1"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-36"
      - name: Build and test
        run: |
          gradle :app:assembleDebug
          gradle :app:lintDebug
          gradle :app:testDebugUnitTest
      - name: Prepare release APK
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Vynora-${{ inputs.version }}-debug.apk"
          sha256sum "release/Vynora-${{ inputs.version }}-debug.apk" > "release/SHA256SUMS.txt"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: main
          name: Vynora ${{ inputs.version }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            release/Vynora-${{ inputs.version }}-debug.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
