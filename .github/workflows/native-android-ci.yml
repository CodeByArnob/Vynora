name: Vynora Native Android CI

on:
  push:
    branches: [native-kotlin-compose]
    paths:
      - "native/**"
      - ".github/workflows/native-android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test native Android app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: native
        run: gradle :app:assembleDebug

      - name: Run unit tests
        working-directory: native
        run: gradle :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vynora-native-debug-apk
          path: native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
