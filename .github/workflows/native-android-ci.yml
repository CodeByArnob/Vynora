name: Vynora Native Android CI

on:
  push:
    branches: [main, native-kotlin-compose]
    paths: ["native/**", ".github/workflows/native-android-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["native/**", ".github/workflows/native-android-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vynora-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint and test native Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android API 37
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-37"
      - name: Build debug APK
        working-directory: native
        run: gradle :app:assembleDebug
      - name: Android lint
        working-directory: native
        run: gradle :app:lintDebug
      - name: Run unit tests
        working-directory: native
        run: gradle :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vynora-native-debug-apk
          path: native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
