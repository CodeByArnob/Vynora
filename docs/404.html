<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · Vynora</title>
  <link rel="icon" type="image/png" href="assets/vynora_icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px;">
  <div style="max-width: 500px; background: var(--bg-glass-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 48px; backdrop-filter: blur(16px);">
    <img src="assets/vynora_icon.png" alt="Vynora Logo" width="64" height="64" style="border-radius: 14px; margin-bottom: 20px; box-shadow: 0 0 20px var(--accent-green-glow);" />
    <h1 style="font-size: 4rem; font-weight: 900; margin-bottom: 8px;" class="gradient-text">404</h1>
    <h2 style="font-size: 1.4rem; margin-bottom: 16px;">Track Not Found</h2>
    <p style="color: var(--text-secondary); margin-bottom: 30px; font-size: 0.95rem;">
      The page or release asset you are looking for has moved or does not exist.
    </p>
    <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
      <a href="index.html" class="btn btn-primary btn-sm">Return Home</a>
      <a href="https://github.com/CodeByArnob/Vynora" class="btn btn-secondary btn-sm">View on GitHub</a>
    </div>
  </div>
</body>
</html>
