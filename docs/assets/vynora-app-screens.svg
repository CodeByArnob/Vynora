      <stop offset="0%" stop-color="#06080D" />
      <stop offset="50%" stop-color="#0B111D" />
      <stop offset="100%" stop-color="#071510" />
    </linearGradient>
    <linearGradient id="cardSpot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#153526" />
      <stop offset="100%" stop-color="#0F172A" />
