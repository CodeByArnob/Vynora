      <g transform="translate(360, 27)" stroke="url(#emeraldGrad)" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-12" x2="0" y2="12"><animate attributeName="y1" values="-6;-16;-6" dur="0.7s" repeatCount="indefinite"/><animate attributeName="y2" values="6;16;6" dur="0.7s" repeatCount="indefinite"/></line>
        <line x1="14" y1="-15" x2="14" y2="15"><animate attributeName="y1" values="-15;-5;-15" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y2" values="15;5;15" dur="0.9s" repeatCount="indefinite"/></line>
        <line x1="28" y1="-10" x2="28" y2="10"><animate attributeName="y1" values="-8;-18;-8" dur="0.6s" repeatCount="indefinite"/><animate attributeName="y2" values="8;18;8" dur="0.6s" repeatCount="indefinite"/></line>
        <line x1="42" y1="-18" x2="42" y2="18"><animate attributeName="y1" values="-18;-7;-18" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y2" values="18;7;18" dur="0.8s" repeatCount="indefinite"/></line>
        <line x1="56" y1="-14" x2="56" y2="14"><animate attributeName="y1" values="-7;-16;-7" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y2" values="7;16;7" dur="1.0s" repeatCount="indefinite"/></line>
        <line x1="70" y1="-9" x2="70" y2="9"><animate attributeName="y1" values="-14;-4;-14" dur="0.75s" repeatCount="indefinite"/><animate attributeName="y2" values="14;4;14" dur="0.75s" repeatCount="indefinite"/></line>
        <line x1="84" y1="-16" x2="84" y2="16"><animate attributeName="y1" values="-6;-17;-6" dur="0.65s" repeatCount="indefinite"/><animate attributeName="y2" values="6;17;6" dur="0.65s" repeatCount="indefinite"/></line>
        <line x1="98" y1="-12" x2="98" y2="12"><animate attributeName="y1" values="-16;-6;-16" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y2" values="16;6;16" dur="0.85s" repeatCount="indefinite"/></line>
        <line x1="112" y1="-15" x2="112" y2="15"><animate attributeName="y1" values="-9;-18;-9" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y2" values="9;18;9" dur="0.95s" repeatCount="indefinite"/></line>
        <line x1="126" y1="-10" x2="126" y2="10"><animate attributeName="y1" values="-15;-5;-15" dur="0.7s" repeatCount="indefinite"/><animate attributeName="y2" values="15;5;15" dur="0.7s" repeatCount="indefinite"/></line>
        <line x1="140" y1="-17" x2="140" y2="17"><animate attributeName="y1" values="-7;-17;-7" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y2" values="7;17;7" dur="0.8s" repeatCount="indefinite"/></line>
        <line x1="154" y1="-11" x2="154" y2="11"><animate attributeName="y1" values="-13;-4;-13" dur="0.6s" repeatCount="indefinite"/><animate attributeName="y2" values="13;4;13" dur="0.6s" repeatCount="indefinite"/></line>
        <line x1="168" y1="-16" x2="168" y2="16"><animate attributeName="y1" values="-6;-16;-6" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y2" values="6;16;6" dur="0.9s" repeatCount="indefinite"/></line>
        <line x1="182" y1="-13" x2="182" y2="13"><animate attributeName="y1" values="-15;-6;-15" dur="0.75s" repeatCount="indefinite"/><animate attributeName="y2" values="15;6;15" dur="0.75s" repeatCount="indefinite"/></line>
        <line x1="196" y1="-9" x2="196" y2="9"><animate attributeName="y1" values="-5;-14;-5" dur="0.65s" repeatCount="indefinite"/><animate attributeName="y2" values="5;14;5" dur="0.65s" repeatCount="indefinite"/></line>
        <line x1="210" y1="-15" x2="210" y2="15"><animate attributeName="y1" values="-16;-7;-16" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y2" values="16;7;16" dur="0.85s" repeatCount="indefinite"/></line>
        <line x1="224" y1="-12" x2="224" y2="12"><animate attributeName="y1" values="-8;-17;-8" dur="0.7s" repeatCount="indefinite"/><animate attributeName="y2" values="8;17;8" dur="0.7s" repeatCount="indefinite"/></line>
        <line x1="238" y1="-10" x2="238" y2="10"><animate attributeName="y1" values="-14;-5;-14" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y2" values="14;5;14" dur="0.9s" repeatCount="indefinite"/></line>
        <line x1="252" y1="-16" x2="252" y2="16"><animate attributeName="y1" values="-6;-15;-6" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y2" values="6;15;6" dur="0.8s" repeatCount="indefinite"/></line>
        <line x1="266" y1="-11" x2="266" y2="11"><animate attributeName="y1" values="-12;-4;-12" dur="0.65s" repeatCount="indefinite"/><animate attributeName="y2" values="12;4;12" dur="0.65s" repeatCount="indefinite"/></line>
        <line x1="280" y1="-14" x2="280" y2="14"><animate attributeName="y1" values="-7;-16;-7" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y2" values="7;16;7" dur="0.95s" repeatCount="indefinite"/></line>
        <line x1="294" y1="-9" x2="294" y2="9"><animate attributeName="y1" values="-13;-5;-13" dur="0.75s" repeatCount="indefinite"/><animate attributeName="y2" values="13;5;13" dur="0.75s" repeatCount="indefinite"/></line>
        <line x1="308" y1="-15" x2="308" y2="15"><animate attributeName="y1" values="-6;-14;-6" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y2" values="6;14;6" dur="0.85s" repeatCount="indefinite"/></line>
      </g>
    </g>
  </g>
</svg>
