<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0D1520" />
      <stop offset="100%" stop-color="#091E16" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954" />
      <stop offset="50%" stop-color="#1ED760" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="glowHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Main Dark Slate Card -->
  <rect width="1200" height="420" rx="28" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Animated Ambient Emerald Glow -->
  <circle cx="230" cy="210" r="190" fill="url(#glowHalo)">
    <animate attributeName="r" values="175;205;175" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="980" cy="120" r="160" fill="url(#glowHalo)">
    <animate attributeName="r" values="140;180;140" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Subtle Grid Lines -->
  <g stroke="#1E293B" stroke-width="0.7" opacity="0.45">
    <line x1="0" y1="84" x2="1200" y2="84" />
    <line x1="0" y1="168" x2="1200" y2="168" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="336" x2="1200" y2="336" />
    <line x1="420" y1="0" x2="420" y2="420" />
  </g>

  <!-- Left: Text-Free Vynora Adaptive Launcher Icon (Animated Vinyl + Acoustic Wave) -->
  <g transform="translate(105, 85)" filter="url(#softShadow)">
    <rect width="250" height="250" rx="56" fill="#07090E" stroke="#1DB954" stroke-width="2.5" />
    <path d="M0 56 C0 25 25 0 56 0 H194 C225 0 250 25 250 56 V125 H0 Z" fill="#0D1422" opacity="0.65" />

    <!-- Rotating Vinyl Groove Ring -->
    <g transform="translate(125, 125)">
      <circle r="92" fill="#0E1726" stroke="#1DB954" stroke-width="4" />
      <g>
        <circle r="76" fill="none" stroke="#26354D" stroke-width="2.5" stroke-dasharray="18 10" />
        <circle r="60" fill="none" stroke="#1ED760" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="12 8" />
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
      </g>

      <!-- Animated Acoustic Equalizer Wave Bars (Text-Free Brand Symbol) -->
      <line x1="-48" y1="-18" x2="-48" y2="18" stroke="#1ED760" stroke-width="8" stroke-linecap="round">
        <animate attributeName="y1" values="-16;-32;-16" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y2" values="16;32;16" dur="1.1s" repeatCount="indefinite" />
      </line>
      <line x1="-32" y1="-34" x2="-32" y2="34" stroke="#1ED760" stroke-width="8" stroke-linecap="round">
        <animate attributeName="y1" values="-36;-18;-36" dur="0.9s" repeatCount="indefinite" />
        <animate attributeName="y2" values="36;18;36" dur="0.9s" repeatCount="indefinite" />
      </line>
      <line x1="-16" y1="-52" x2="-16" y2="52" stroke="#1ED760" stroke-width="8" stroke-linecap="round">
        <animate attributeName="y1" values="-54;-28;-54" dur="1.25s" repeatCount="indefinite" />
        <animate attributeName="y2" values="54;28;54" dur="1.25s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="-64" x2="0" y2="64" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round">
        <animate attributeName="y1" values="-66;-38;-66" dur="0.85s" repeatCount="indefinite" />
        <animate attributeName="y2" values="66;38;66" dur="0.85s" repeatCount="indefinite" />
      </line>
      <line x1="16" y1="-48" x2="16" y2="48" stroke="#1ED760" stroke-width="8" stroke-linecap="round">
        <animate attributeName="y1" values="-46;-60;-46" dur="1.05s" repeatCount="indefinite" />
        <animate attributeName="y2" values="46;60;46" dur="1.05s" repeatCount="indefinite" />
      </line>
      <line x1="32" y1="-30" x2="32" y2="30" stroke="#1ED760" stroke-width="8" stroke-linecap="round">
        <animate attributeName="y1" values="-28;-44;-28" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y2" values="28;44;28" dur="1.3s" repeatCount="indefinite" />
      </line>
      <line x1="48" y1="-16" x2="48" y2="16" stroke="#1ED760" stroke-width="8" stroke-linecap="round">
        <animate attributeName="y1" values="-14;-28;-14" dur="1.0s" repeatCount="indefinite" />
        <animate attributeName="y2" values="14;28;14" dur="1.0s" repeatCount="indefinite" />
      </line>

      <!-- Center Vinyl Spindle -->
      <circle r="13" fill="#07090E" stroke="#1DB954" stroke-width="4" />
      <circle r="4.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Right: Typography, Badges & Animated Waveform -->
  <g transform="translate(415, 78)">
    <!-- Release Pill -->
    <rect x="0" y="0" width="380" height="32" rx="16" fill="#10281E" stroke="#1DB954" stroke-width="1.2" />
    <circle cx="18" cy="16" r="5" fill="#1ED760">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="21" fill="#1ED760" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2">
      VYNORA v0.4.0 · NATIVE ANDROID MUSIC &amp; VIDEO
    </text>

    <!-- Main Title -->
    <text x="0" y="88" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">
      Vynora Music Player
    </text>
    <text x="0" y="128" fill="#94A3B8" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="500">
      Spotify &amp; YouTube Music Material 3 UI · 90-Day Official Indian Releases · Media3
    </text>

    <!-- Feature Chips -->
    <g transform="translate(0, 158)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700">
      <rect x="0" y="0" width="215" height="38" rx="10" fill="#111827" stroke="#1DB954" stroke-width="1.2" />
      <text x="18" y="24" fill="#F8FAFC">✓ Error 152/153 Fixed (3P HTTPS)</text>

      <rect x="228" y="0" width="225" height="38" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.2" />
      <text x="246" y="24" fill="#F8FAFC">✓ Video | Song Auto-Fallback</text>

      <rect x="466" y="0" width="245" height="38" rx="10" fill="#111827" stroke="#A855F7" stroke-width="1.2" />
      <text x="484" y="24" fill="#F8FAFC">✓ T-Series · Sony · Zee · Arijit</text>
    </g>

