<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 116" width="100%" height="100%">
  <defs>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B2217" />
      <stop offset="50%" stop-color="#113624" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954" />
      <stop offset="100%" stop-color="#1ED760" />
    </linearGradient>
  </defs>

  <rect width="920" height="116" rx="22" fill="url(#ctaBg)" stroke="#1DB954" stroke-width="2" />

  <!-- Left Animated Download Badge -->
  <g transform="translate(26, 22)">
    <rect width="72" height="72" rx="18" fill="#07090E" stroke="#1ED760" stroke-width="2" />
    <g transform="translate(36, 34)">
      <path d="M0 -14 V10 M-10 2 L0 12 L10 2" stroke="#1ED760" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <animateTransform attributeName="transform" type="translate" values="0,-3; 0,4; 0,-3" dur="1.3s" repeatCount="indefinite" />
      </path>
      <line x1="-14" y1="18" x2="14" y2="18" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Center Text -->
  <g transform="translate(118, 44)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="0" y="0" fill="#FFFFFF" font-size="24" font-weight="900">
      1-Click Direct Download · Vynora v0.8.0 Android APK
    </text>
    <text x="0" y="28" fill="#A7F3D0" font-size="14" font-weight="600">
      Verified GitHub Release Asset · 26.9 MB · Android 8.0+ (API 26–36) · SHA-256 Verified
    </text>
  </g>

  <!-- Right Pill CTA -->
  <g transform="translate(650, 28)">
    <rect width="242" height="60" rx="30" fill="url(#btnGrad)">
      <animate attributeName="opacity" values="1;0.88;1" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <text x="121" y="37" text-anchor="middle" fill="#07090E" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="0.5">
      DOWNLOAD APK
    </text>
  </g>
</svg>
