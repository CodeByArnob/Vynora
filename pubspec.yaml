name: vynora
description: An open-source Material 3 music discovery and local music player.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.7.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.3.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: assets/icon/vynora_icon.png
  min_sdk_android: 23
  adaptive_icon_background: "#100A24"
  adaptive_icon_foreground: assets/icon/vynora_icon.png
